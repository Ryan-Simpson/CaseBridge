[project]
name = "casebridge-backend"
version = "0.1.0"
description = "CaseBridge agentic pipeline backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "ollama>=0.4",
    "langgraph>=0.2",
    "pydantic-ai>=0.0.14",
    "instructor>=1.6",
    "json-logic-qubit>=0.9",
    "pypdf>=5.0",
    "reportlab>=4.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
